name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — required for provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Publish to JSR
        # Real publish (from Actions, OIDC) is what generates the provenance
        # statement. Runs for both stable and prerelease GitHub releases — the
        # version is read from deno.json, so a prerelease tag publishes a
        # prerelease version that does not become the JSR "latest".
        run: deno publish
