name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — required for provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Publish (dry-run)
        # TODO: flip `deno publish --dry-run` -> `deno publish` once validated.
        # Real publish (from Actions, OIDC) is what generates the provenance statement.
        if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
        run: deno publish --dry-run
