name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate without publishing to JSR
        type: boolean
        default: true

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — required for provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Publish
        # Skip pre-releases — only stable releases publish to JSR.
        # Remove the guard to publish pre-release versions too.
        if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.dry-run }}" == "true" ]; then
            deno publish --dry-run
          else
            deno publish
          fi
